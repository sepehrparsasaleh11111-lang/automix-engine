[workspace]
resolver = "2"
members = ["openmix-core", "openmix-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["OpenMix AI contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "pcm"] }